    \ forward pass, not here.\n\n        Args:\n            image_size (tuple[int,\
    \ int] | None, optional): Target image size.\n                Defaults to ``(256,\
    \ 256)``.\n\n        Returns:\n            PreProcessor: Configured pre-processor\
    \ with resize transform.\n        \"\"\"\n        image_size = image_size or (256,\
    \ 256)\n        transform = Compose([Resize(image_size, antialias=True)])\n  \
    \      return PreProcessor(transform=transform)\n"
